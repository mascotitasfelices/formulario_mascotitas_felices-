<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mascotitas Felices - Registro de Envíos</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #004d40;
      --primary-dark: #00332c;
      --accent: #10b981;
      --accent-light: #e6f4f1;
      --bg-gradient: linear-gradient(135deg, #f0fdf4 0%, #e0f2fe 100%);
      --card-bg: rgba(255, 255, 255, 0.95);
      --text-main: #0f172a;
      --text-muted: #475569;
      --border-color: #cbd5e1;
      --shadow-lg: 0 20px 25px -5px rgba(0, 0, 0, 0.08), 0 8px 10px -6px rgba(0, 0, 0, 0.04);
      --radius: 16px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: var(--bg-gradient);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 30px 15px;
    }

    .card-wrapper {
      width: 100%;
      max-width: 620px;
      background: var(--card-bg);
      border-radius: var(--radius);
      box-shadow: var(--shadow-lg);
      border: 1px solid rgba(255, 255, 255, 0.8);
      backdrop-filter: blur(10px);
      padding: 40px 35px;
      position: relative;
      overflow: hidden;
    }

    .card-wrapper::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 6px;
      background: linear-gradient(90deg, #004d40, #10b981);
    }

    .header { text-align: center; margin-bottom: 28px; }
    .logo-container { position: relative; display: inline-block; margin-bottom: 12px; }
    .logo-img {
      width: 110px; height: 110px; border-radius: 50%; object-fit: cover;
      box-shadow: 0 10px 15px -3px rgba(0, 77, 64, 0.2); border: 3px solid #ffffff;
    }

    .header h1 { font-size: 26px; font-weight: 800; color: var(--primary); letter-spacing: -0.5px; }
    .header p { font-size: 14px; color: var(--text-muted); margin-top: 4px; }

    .welcome-banner {
      background: var(--accent-light);
      border-left: 4px solid var(--accent);
      padding: 14px 18px;
      border-radius: 10px;
      margin-bottom: 28px;
      font-size: 13.5px;
      color: #065f46;
      line-height: 1.5;
    }

    .form-group { margin-bottom: 20px; }
    label { display: block; font-size: 13px; font-weight: 700; color: var(--text-main); margin-bottom: 7px; text-transform: uppercase; letter-spacing: 0.5px; }
    label span.req { color: #ef4444; }

    input, select, textarea {
      width: 100%; padding: 12px 16px; border: 1.5px solid var(--border-color);
      border-radius: 10px; font-size: 15px; font-family: inherit; color: var(--text-main);
      background-color: #ffffff; transition: all 0.25s ease;
    }

    input:focus, select:focus, textarea:focus {
      outline: none; border-color: var(--accent); box-shadow: 0 0 0 4px rgba(16, 185, 129, 0.15);
    }

    input[readonly] { background-color: #f1f5f9; color: #64748b; cursor: not-allowed; }

    .btn-submit {
      width: 100%; padding: 16px; background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
      color: #ffffff; border: none; border-radius: 10px; font-size: 16px; font-weight: 700; cursor: pointer;
      box-shadow: 0 10px 15px -3px rgba(0, 77, 64, 0.3); transition: all 0.25s ease; margin-top: 10px;
    }

    .btn-submit:hover { transform: translateY(-2px); box-shadow: 0 12px 20px -3px rgba(0, 77, 64, 0.4); }
    .btn-submit:disabled { background: #94a3b8; transform: none; box-shadow: none; cursor: not-allowed; }

    #toast-container { position: fixed; top: 24px; right: 24px; z-index: 9999; }
    .toast {
      min-width: 280px; padding: 14px 20px; margin-bottom: 10px; border-radius: 12px; color: #fff;
      font-weight: 600; font-size: 14px; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1); opacity: 0;
      transform: translateX(50px); transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .toast.show { opacity: 1; transform: translateX(0); }
    .toast.warning { background-color: #f59e0b; }
    .toast.error { background-color: #ef4444; }

    .modal-overlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(4px);
      display: flex; justify-content: center; align-items: center;
      z-index: 10000; opacity: 0; pointer-events: none; transition: all 0.3s ease;
    }
    .modal-overlay.active { opacity: 1; pointer-events: auto; }
    .modal-card {
      background: white; padding: 36px 30px; border-radius: 20px; text-align: center;
      max-width: 400px; width: 90%; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.25);
    }
    .modal-card h3 { color: var(--primary); font-size: 22px; font-weight: 800; margin-top: 10px; }
    .modal-card p { color: var(--text-muted); font-size: 14.5px; margin: 12px 0 24px 0; line-height: 1.5; }
    .modal-btn { background: #25d366; color: white; padding: 12px 28px; border-radius: 10px; border: none; font-weight: 700; cursor: pointer; font-size: 15px; }
    .modal-btn:hover { background: #1eb855; }
  </style>
</head>
<body>

<div id="toast-container"></div>

<!-- Modal Agradecimiento -->
<div class="modal-overlay" id="thankYouModal">
  <div class="modal-card">
    <div style="font-size: 48px;">🐾</div>
    <h3>¡Registro Completado!</h3>
    <p>Tu información ha sido registrada exitosamente. Haz clic en el botón para enviar los detalles por WhatsApp.</p>
    <button class="modal-btn" id="btnWhatsapp" onclick="abrirWhatsapp()">📱 Enviar por WhatsApp</button>
  </div>
</div>

<div class="card-wrapper">
  <div class="header">
    <div class="logo-container">
      <img src="https://lh3.googleusercontent.com/d/1yfiRwqjGZ5TYr5iwaxRiKaDv-7tT7Mgp" alt="Logo Mascotitas Felices" class="logo-img">
    </div>
    <h1>Mascotitas Felices</h1>
    <p>Plataforma Oficial de Registro de Envíos</p>
  </div>

  <div class="welcome-banner">
    🐾 <strong>¡Bienvenido(a)!</strong> Ingresa tus datos completos para coordinar el envío o despacho de tus productos.
  </div>

  <form id="clientForm">
    
    <div class="form-group">
      <label>Tipo de Documento <span class="req">*</span></label>
      <select id="tipoDoc" onchange="actualizarLongitudDoc()" required>
        <option value="DNI">DNI (8 dígitos)</option>
        <option value="CE">Carnet de Extranjería (9 dígitos)</option>
      </select>
    </div>

    <div class="form-group">
      <label id="labelDoc">N° Documento <span class="req">*</span></label>
      <input type="text" id="documento" required maxlength="8" placeholder="Ingrese los números de su documento">
    </div>

    <div class="form-group">
      <label>N° Celular <span class="req">*</span></label>
      <input type="text" id="celular" maxlength="9" required placeholder="Ejm: 987654321">
    </div>

    <div class="form-group">
      <label>Nombres y Apellidos Completos <span class="req">*</span></label>
      <input type="text" id="nombres" required placeholder="Ingrese nombres y apellidos">
    </div>

    <div class="form-group">
      <label>Departamento <span class="req">*</span></label>
      <select id="departamento" onchange="cargarProvincias()" required>
        <option value="">Seleccione...</option>
      </select>
    </div>

    <div class="form-group">
      <label>Provincia <span class="req">*</span></label>
      <select id="provincia" onchange="cargarDistritos()" required>
        <option value="">Seleccione...</option>
      </select>
    </div>

    <div class="form-group">
      <label>Distrito <span class="req">*</span></label>
      <select id="distrito" onchange="evaluarTiposEntrega()" required>
        <option value="">Seleccione...</option>
      </select>
    </div>

    <div class="form-group">
      <label>Tipo de Entrega <span class="req">*</span></label>
      <select id="tipoEntrega" onchange="evaluarOpcionesEntrega()" required>
        <option value="">Seleccione un distrito primero...</option>
      </select>
    </div>

    <div class="form-group" id="groupOtraAgencia" style="display:none;">
      <label>Nombre de la Agencia Destino <span class="req">*</span></label>
      <input type="text" id="otraAgenciaInput" placeholder="Ejm: Marvisur, Flores, Civa, etc.">
    </div>

    <div class="form-group" id="groupSede">
      <label id="labelSede">Sede / Dirección de Entrega <span class="req">*</span></label>
      <select id="sedeSelect" style="display:none;"></select>
      <input type="text" id="direccionInput" required placeholder="Ingrese dirección o agencia destino">
    </div>

    <div class="form-group" id="groupReferencia">
      <label id="labelReferencia">Referencia de Entrega (Opcional)</label>
      <textarea id="referencia" rows="2" placeholder="Puntos de referencia o indicaciones adicionales"></textarea>
    </div>

    <button type="submit" id="btnSubmit" class="btn-submit">Confirmar y Enviar Registro</button>
  </form>
</div>

<script src="ubigeo.js"></script>

<script>
  const SCRIPT_URL = "https://script.google.com/macros/s/AKfycby5BtpRIgYEwGUVzbDhQcJN8PbpGMdrPibepLi8q5xQdz8zgv32s-hdgaqWH7kX8pBT/exec"; 
  const PHONE_WHATSAPP = "51973376798";

  let dbUbigeo = typeof DATA_UBIGEO !== 'undefined' ? DATA_UBIGEO : [];
  let dbShalom = [];
  let urlWhatsappFinal = "";

  // Normalizar cadenas para evitar fallos por tildes o espacios
  function normalizarTexto(str) {
    if (!str) return "";
    return str.toString()
      .normalize("NFD")
      .replace(/[\u0300-\u036f]/g, "")
      .trim()
      .toUpperCase();
  }

  window.onload = async () => {
    if (dbUbigeo.length > 0) cargarDepartamentos();

    try {
      const resSha = await fetch(SCRIPT_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify({ action: "getShalom" })
      });
      const dataSha = await resSha.json();
      if (dataSha.result === "success") {
        dbShalom = dataSha.data;
        // Si el usuario ya había seleccionado Shalom, actualizar opciones en caliente
        if (document.getElementById("tipoEntrega").value === "Shalom-Recojo en Agencia") {
          evaluarOpcionesEntrega();
        }
      }
    } catch (e) {
      console.warn("No se pudieron cargar las sedes de Shalom:", e);
    }
  };

  function mostrarToast(mensaje, tipo = "warning") {
    const container = document.getElementById("toast-container");
    const toast = document.createElement("div");
    toast.className = `toast ${tipo}`;
    toast.innerText = mensaje;
    container.appendChild(toast);
    setTimeout(() => toast.classList.add("show"), 100);
    setTimeout(() => {
      toast.classList.remove("show");
      setTimeout(() => toast.remove(), 300);
    }, 3500);
  }

  function actualizarLongitudDoc() {
    const tipo = document.getElementById("tipoDoc").value;
    const input = document.getElementById("documento");
    input.maxLength = (tipo === "DNI") ? 8 : 9;
    input.value = "";
  }

  function cargarDepartamentos() {
    const deps = [...new Set(dbUbigeo.map(item => item[0]))].filter(Boolean).sort();
    const select = document.getElementById("departamento");
    select.innerHTML = '<option value="">Seleccione...</option>';
    deps.forEach(d => select.innerHTML += `<option value="${d}">${d}</option>`);
  }

  function cargarProvincias() {
    const dep = document.getElementById("departamento").value;
    const provs = [...new Set(dbUbigeo.filter(i => i[0] === dep).map(i => i[1]))].filter(Boolean).sort();
    const select = document.getElementById("provincia");
    select.innerHTML = '<option value="">Seleccione...</option>';
    provs.forEach(p => select.innerHTML += `<option value="${p}">${p}</option>`);
    document.getElementById("distrito").innerHTML = '<option value="">Seleccione...</option>';
  }

  function cargarDistritos() {
    const dep = document.getElementById("departamento").value;
    const prov = document.getElementById("provincia").value;
    const dists = [...new Set(dbUbigeo.filter(i => i[0] === dep && i[1] === prov).map(i => i[2]))].filter(Boolean).sort();
    const select = document.getElementById("distrito");
    select.innerHTML = '<option value="">Seleccione...</option>';
    dists.forEach(d => select.innerHTML += `<option value="${d}">${d}</option>`);
  }

  function evaluarTiposEntrega() {
    const dist = normalizarTexto(document.getElementById("distrito").value);
    const selectEntrega = document.getElementById("tipoEntrega");
    selectEntrega.innerHTML = '<option value="">Seleccione...</option>';

    let opcionesDisponibles = (dist === "CHIMBOTE" || dist === "NUEVO CHIMBOTE")
      ? ["Mascotitas Felices-Recojo en Local", "Delivery"]
      : ["Shalom-Recojo en Agencia", "Olva Courier-Delivery", "Olva Courier-Recojo en Local", "Otros"];

    opcionesDisponibles.forEach(op => selectEntrega.innerHTML += `<option value="${op}">${op}</option>`);
    evaluarOpcionesEntrega();
  }

  function evaluarOpcionesEntrega() {
    const entrega = document.getElementById("tipoEntrega").value;
    const distSeleccionado = normalizarTexto(document.getElementById("distrito").value);
    
    const groupOtraAgencia = document.getElementById("groupOtraAgencia");
    const otraAgenciaInput = document.getElementById("otraAgenciaInput");
    const groupSede = document.getElementById("groupSede");
    const sedeSelect = document.getElementById("sedeSelect");
    const direccionInput = document.getElementById("direccionInput");
    const labelSede = document.getElementById("labelSede");
    const referencia = document.getElementById("referencia");

    groupOtraAgencia.style.display = "none";
    otraAgenciaInput.required = false;
    groupSede.style.display = "block";
    direccionInput.style.display = "block";
    sedeSelect.style.display = "none";
    sedeSelect.required = false;
    direccionInput.required = true;
    referencia.required = false;

    if (entrega === "Mascotitas Felices-Recojo en Local") {
      labelSede.innerHTML = 'Sede de Recojo <span class="req">*</span>';
      direccionInput.value = "Local Principal - Mascotitas Felices";
      direccionInput.readOnly = true;
      referencia.value = "Recojo en Tienda";
      referencia.readOnly = true;
    } else if (entrega === "Delivery") {
      labelSede.innerHTML = 'Dirección o Ubicación exacta <span class="req">*</span>';
      direccionInput.placeholder = "Solicitar dirección o ubicación exacta";
      direccionInput.value = "";
      direccionInput.readOnly = false;
      referencia.value = "";
      referencia.readOnly = false;
    } else if (entrega === "Shalom-Recojo en Agencia") {
      labelSede.innerHTML = 'Sede de Agencia (Shalom) <span class="req">*</span>';
      direccionInput.readOnly = false;
      referencia.readOnly = false;

      // Filtrar Sedes Shalom por Distrito (Columna C de la hoja, índice 2)
      const sedesShalom = dbShalom.filter(s => s[2] && normalizarTexto(s[2]) === distSeleccionado);

      if (sedesShalom.length > 0) {
        sedeSelect.style.display = "block";
        direccionInput.style.display = "none";
        sedeSelect.required = true;
        direccionInput.required = false;
        
        sedeSelect.innerHTML = '<option value="">Seleccione Sede Shalom...</option>';
        sedesShalom.forEach(s => {
          const nombreSede = s[3] ? s[3].toString().trim() : "";
          if (nombreSede) {
            sedeSelect.innerHTML += `<option value="${nombreSede}">${nombreSede}</option>`;
          }
        });
      } else {
        // En caso no haya sede registrada para ese distrito específico
        sedeSelect.style.display = "none";
        direccionInput.style.display = "block";
        direccionInput.placeholder = "Ingrese nombre de la sede Shalom";
        direccionInput.value = "";
      }
    } else if (entrega.includes("Olva Courier")) {
      labelSede.innerHTML = entrega.includes("Local") ? 'Sede/Agencia Olva Courier <span class="req">*</span>' : 'Dirección de Entrega Olva <span class="req">*</span>';
      direccionInput.placeholder = "Ingrese dirección o agencia destino";
      direccionInput.value = "";
      direccionInput.readOnly = false;
      referencia.value = "";
      referencia.readOnly = false;
    } else if (entrega === "Otros") {
      groupOtraAgencia.style.display = "block";
      otraAgenciaInput.required = true;
      labelSede.innerHTML = 'Sede / Dirección de la Agencia Destino <span class="req">*</span>';
      direccionInput.placeholder = "Ingrese la agencia o dirección de envío";
      direccionInput.value = "";
      direccionInput.readOnly = false;
      referencia.value = "";
      referencia.readOnly = false;
    }
  }

  document.getElementById("clientForm").onsubmit = async (e) => {
    e.preventDefault();

    const tipoDoc = document.getElementById("tipoDoc").value;
    const documento = document.getElementById("documento").value.trim();
    const celular = document.getElementById("celular").value.trim();
    const entrega = document.getElementById("tipoEntrega").value;
    const nombres = document.getElementById("nombres").value.trim();
    const departamento = document.getElementById("departamento").value;
    const provincia = document.getElementById("provincia").value;
    const distrito = document.getElementById("distrito").value;
    const referencia = document.getElementById("referencia").value.trim();

    if (tipoDoc === "DNI" && !/^\d{8}$/.test(documento)) {
      mostrarToast("⚠️ El DNI debe tener exactamente 8 dígitos numéricos.", "warning");
      return;
    }

    if (tipoDoc === "CE" && !/^\d{9}$/.test(documento)) {
      mostrarToast("⚠️ El Carnet de Extranjería debe tener exactamente 9 dígitos numéricos.", "warning");
      return;
    }

    if (!/^\d{9}$/.test(celular)) {
      mostrarToast("⚠️ El celular debe tener exactamente 9 dígitos numéricos.", "warning");
      return;
    }

    let agenciaFinal = "";
    if (entrega === "Shalom-Recojo en Agencia") agenciaFinal = "SHALOM";
    else if (entrega.includes("Olva Courier")) agenciaFinal = "OLVA COURIER";
    else if (entrega === "Mascotitas Felices-Recojo en Local") agenciaFinal = "MASCOTITAS FELICES";
    else if (entrega === "Otros") agenciaFinal = document.getElementById("otraAgenciaInput").value.trim().toUpperCase();
    else agenciaFinal = "DELIVERY LOCAL";

    let sedeFinal = (entrega === "Shalom-Recojo en Agencia" && document.getElementById("sedeSelect").style.display !== "none")
      ? document.getElementById("sedeSelect").value
      : document.getElementById("direccionInput").value.trim();

    const mensajeWS = 
      `🐾 *NUEVO REGISTRO DE ENVÍO - MASCOTITAS FELICES* 🐾\n\n` +
      `👤 *Cliente:* ${nombres}\n` +
      `🪪 *${tipoDoc}:* ${documento}\n` +
      `📱 *Celular:* ${celular}\n\n` +
      `📍 *DESTINO:*\n` +
      `• *Departamento:* ${departamento}\n` +
      `• *Provincia:* ${provincia}\n` +
      `• *Distrito:* ${distrito}\n\n` +
      `🚚 *DETALLES DE ENTREGA:*\n` +
      `• *Tipo de Entrega:* ${entrega}\n` +
      `• *Agencia:* ${agenciaFinal}\n` +
      `• *Sede / Dirección:* ${sedeFinal}` +
      (referencia ? `\n• *Referencia:* ${referencia}` : '');

    urlWhatsappFinal = `https://api.whatsapp.com/send?phone=${PHONE_WHATSAPP}&text=${encodeURIComponent(mensajeWS)}`;

    const btn = document.getElementById("btnSubmit");
    btn.disabled = true;
    btn.innerText = "Procesando...";

    const payload = {
      action: "saveClient",
      data: {
        documento: documento,
        celular: celular,
        nombres: nombres,
        departamento: departamento,
        provincia: provincia,
        distrito: distrito,
        tipoEntrega: entrega,
        agencia: agenciaFinal,
        sedeDireccion: sedeFinal,
        referencia: referencia
      }
    };

    try {
      fetch(SCRIPT_URL, {
        method: "POST",
        mode: "no-cors",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify(payload)
      });

      setTimeout(() => {
        document.getElementById("thankYouModal").classList.add("active");
        document.getElementById("clientForm").reset();
        evaluarOpcionesEntrega();
        btn.disabled = false;
        btn.innerText = "Confirmar y Enviar Registro";
      }, 800);

    } catch (err) {
      mostrarToast("Error de conexión: " + err.message, "error");
      btn.disabled = false;
      btn.innerText = "Confirmar y Enviar Registro";
    }
  };

  function abrirWhatsapp() {
    if (urlWhatsappFinal) {
      window.open(urlWhatsappFinal, "_blank");
    }
    cerrarModal();
  }

  function cerrarModal() {
    document.getElementById("thankYouModal").classList.remove("active");
  }
</script>
</body>
</html>
